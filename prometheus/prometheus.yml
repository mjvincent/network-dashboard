global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: backend
    metrics_path: /prometheus
    static_configs:
      - targets:
          - backend:8000

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: ubuntu-node-exporter
    static_configs:
      - targets:
          - 192.168.68.85:9100

  - job_name: telegraf
    static_configs:
      - targets:
          - telegraf:9273
