[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "15s"
  flush_jitter = "0s"
  omit_hostname = false

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2

# Keep these ping inputs in sync with config/known_devices.yml for local deployments.
# config/known_devices.example.yml documents the expected inventory shape.
[[inputs.ping]]
  urls = ["192.168.68.1"]
  count = 3
  ping_interval = 1.0
  timeout = 2.0
  method = "native"
  [inputs.ping.tags]
    device_name = "Gateway"
    role = "router"

[[inputs.ping]]
  urls = ["192.168.68.85"]
  count = 3
  ping_interval = 1.0
  timeout = 2.0
  method = "native"
  [inputs.ping.tags]
    device_name = "Ubuntu Server"
    role = "server"

[[inputs.ping]]
