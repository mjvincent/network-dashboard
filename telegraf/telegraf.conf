[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "15s"
  flush_jitter = "0s"
  omit_hostname = false

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2

[[inputs.ping]]
  urls = [
    "192.168.68.1",
    "192.168.68.85",
    "host.docker.internal",
    "node-exporter",
    "1.1.1.1",
    "8.8.8.8"
  ]
  count = 3
  ping_interval = 1.0
  timeout = 2.0
  method = "native"
