
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: network-dashboard-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - DEVICE_DB_PATH=/data/devices.db
      - INFLUXDB_URL=http://influxdb:8086
    networks:
      - default
    volumes:
      - backend_data:/data
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: network-dashboard-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - default

  influxdb:
    image: influxdb:2.7
    container_name: network-dashboard-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-password12345}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-network-dashboard}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-network-metrics}
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUXDB_RETENTION:-30d}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    networks:
      - default
    volumes:
      - influxdb_data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana-oss:latest
    container_name: network-dashboard-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-network-dashboard}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-network-metrics}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb
      - prometheus
    networks:
      - default

  prometheus:
    image: prom/prometheus:latest
    container_name: network-dashboard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - default

  node-exporter:
    image: prom/node-exporter:latest
    container_name: network-dashboard-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - default

  telegraf:
    image: telegraf:1.31
    container_name: network-dashboard-telegraf
    restart: unless-stopped
    cap_add:
      - NET_RAW
    ports:
      - "9273:9273"
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

  agent:
    build: ./agent
    container_name: network-dashboard-agent
    env_file:
      - .env
    environment:
      - INFLUXDB_URL=http://influxdb:8086
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - influxdb
    networks:
      - default
volumes:
  influxdb_data:
  backend_data:

networks:
  default:
    name: network-dashboard-network
