version: '3.8'

services:
  backend:
    build:
      context: /Users/michaelvincentjones/Documents/GitHub/network-dashboard/backend
      dockerfile: Dockerfile
    container_name: network-dashboard-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - default
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: network-dashboard-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - default

  influxdb:
    image: influxdb:2.7
    container_name: network-dashboard-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password12345
      - DOCKER_INFLUXDB_INIT_ORG=network-dashboard
      - DOCKER_INFLUXDB_INIT_BUCKET=network-metrics
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    networks:
      - default
    volumes:
      - influxdb_data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana-oss:latest
    container_name: network-dashboard-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - influxdb
    networks:
      - default

volumes:
  influxdb_data:

networks:
  default:
    name: network-dashboard-network