version: '3.8'

services:
  backend:
    build:
      context: /Users/michaelvincentjones/Documents/GitHub/network-dashboard/backend
      dockerfile: Dockerfile
    container_name: network-dashboard-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - default
  
  frontend:
    build:
      context: /Users/michaelvincentjones/Documents/GitHub/network-dashboard/frontend
      dockerfile: Dockerfile
    container_name: network-dashboard-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - default

networks:
  default:
    name: network-dashboard-network